[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-imagemaker"
version = "1.0.0"
description = "AI ImageMaker — AI-имиджмейкер"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gennady Shepelev" }]
keywords = ["llm", "fastapi", "ai"]
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.10.0",
    "openai==1.59.3",
    "httpx==0.28.1",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "mypy==1.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.setuptools]
packages = [
    "api",
    "cache",
    "config",
    "core",
    "llm",
    "llm.providers",
    "models",
    "services",
]
py-modules = ["main"]
